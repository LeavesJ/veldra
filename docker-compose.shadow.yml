# ReserveGrid OS — Shadow Mode Stack
#
# Runs the full verification pipeline against synthetic demo data.
# No real bitcoind required. No SV2 gateway. No test-miner.
#
# Pipeline: rg-demo-feed -> rg-feed-adapter -> template-manager -> pool-verifier
# UI: rg-dashboard (operator UI) + rg-auth (authentication)
#
# Usage:
#   docker compose -f docker-compose.shadow.yml up
#
# This stack is designed for first-time operators evaluating ReserveGrid OS
# without committing infrastructure. Every verifier policy detection fires
# at least once per demo feed cycle.

services:
  # ── Synthetic template feed ──
  rg-demo-feed:
    build:
      context: .
      dockerfile: services/rg-demo-feed/Dockerfile
    environment:
      VELDRA_LOG_FORMAT: json
      VELDRA_LOG_FILTER: info
      VELDRA_DEMO_FEED_LISTEN: "0.0.0.0:9100"
      VELDRA_DEMO_FEED_INTERVAL_MS: "5000"
      VELDRA_ALLOW_NON_LOOPBACK: "1"
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/9100) 2>/dev/null' || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  # ── Feed-to-RPC translator ──
  # Impersonates a bitcoind JSON-RPC endpoint so template-manager can
  # consume demo data without code changes.
  rg-feed-adapter:
    build:
      context: .
      dockerfile: services/rg-feed-adapter/Dockerfile
    environment:
      VELDRA_LOG_FORMAT: json
      VELDRA_LOG_FILTER: info
      VELDRA_ADAPTER_LISTEN: "0.0.0.0:18444"
      VELDRA_ALLOW_NON_LOOPBACK: "1"
      VELDRA_FEED_URL: "ws://rg-demo-feed:9100/ws"
    ports:
      - "18444:18444"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18444/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    depends_on:
      rg-demo-feed:
        condition: service_healthy

  # ── Pool Verifier (shadow mode) ──
  pool-verifier:
    build:
      context: .
      dockerfile: services/pool-verifier/Dockerfile
    user: "0"
    environment:
      VELDRA_LOG_FORMAT: json
      VELDRA_LOG_FILTER: info
      VELDRA_VERIFIER_ADDR: "0.0.0.0:9090"
      VELDRA_HTTP_ADDR: "0.0.0.0:8081"
      VELDRA_API_SECRET_OPTIONAL: "1"
      VELDRA_POLICY_FILE: /config/policy.toml
      VELDRA_VERIFIER_CONFIG: /config/verifier.toml
      VELDRA_MODE: shadow
      # PB-26 ingress connection cap, pinned at the shipped default.
      # This stack publishes 9090 on the host (see ports below) and the
      # ingress takes unauthenticated peers, so the cap is the bound on
      # how much line buffer a reachable peer can make the verifier
      # hold. Only two legitimate streams connect here: template-manager
      # and sv2-gateway.
      VELDRA_VERIFIER_MAX_CONNECTIONS: "${VELDRA_VERIFIER_MAX_CONNECTIONS:-32}"
      # PB-27 per-IP ceiling, pinned at the shipped default. The global
      # cap alone let one address hold every slot; through a published
      # port an external peer arrives as the docker bridge address, so
      # this bounds what any one outside source can take. Container
      # peers each have their own address and are unaffected.
      VELDRA_VERIFIER_MAX_CONNECTIONS_PER_IP: "${VELDRA_VERIFIER_MAX_CONNECTIONS_PER_IP:-8}"
      # PB-27 no-progress budget, pinned at the shipped default. A peer
      # that connects and never speaks now loses its slot after this
      # many seconds instead of holding it for the process lifetime.
      VELDRA_VERIFIER_IDLE_TIMEOUT_SECS: "${VELDRA_VERIFIER_IDLE_TIMEOUT_SECS:-60}"
    volumes:
      - ./config:/config:rw
      # Verdict log lives at /data/verdicts.log inside the container
      # (verdicts.rs `VERDICT_LOG_PATH = "data/verdicts.log"` plus
      # `create_dir_all("data")` relative to the verifier's WORKDIR
      # `/`). Mount ./data on the host so scripts/phase2-spot-check.sh
      # and any other host-side forensic tooling can read the log
      # without `docker compose exec`.
      - ./data:/data:rw
    ports:
      - "9090:9090"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    # PB-13: gate boot on rg-feed-adapter health so the first mempool
    # poll succeeds before any verdict is served, preventing boot-window
    # verifier_phase2_degraded_total inflation. The adapter at
    # rg-feed-adapter:18444 is the [policy.mempool] rpc_url source.
    depends_on:
      rg-feed-adapter:
        condition: service_healthy

  # ── Template Manager (reads from adapter, not bitcoind) ──
  template-manager:
    build:
      context: .
      dockerfile: services/template-manager/Dockerfile
    user: "0"
    environment:
      VELDRA_LOG_FORMAT: json
      VELDRA_LOG_FILTER: info
      VELDRA_MANAGER_CONFIG: /config/manager-shadow.toml
      VELDRA_MANAGER_HTTP_ADDR: "0.0.0.0:8082"
      VELDRA_VERIFIER_ADDR: "pool-verifier:9090"
      VELDRA_API_SECRET_OPTIONAL: "1"
      VELDRA_SHARE_HMAC_OPTIONAL: "1"
    volumes:
      - ./dev:/config:rw
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    depends_on:
      pool-verifier:
        condition: service_healthy
      rg-feed-adapter:
        condition: service_healthy

  # ── Auth Service ──
  rg-auth:
    build:
      context: .
      dockerfile: services/rg-auth/Dockerfile
    user: "0"
    environment:
      VELDRA_ALLOW_NON_LOOPBACK: "1"
      VELDRA_LOG_FORMAT: json
      VELDRA_LOG_FILTER: info
      VELDRA_AUTH_ADDR: "0.0.0.0:3030"
      VELDRA_AUTH_DB: /data/auth.db
      VELDRA_AUTH_SITE_URL: "http://localhost:8084"
      VELDRA_AUTH_ADMIN_EMAIL: "${VELDRA_AUTH_ADMIN_EMAIL:-admin@localhost}"
      VELDRA_AUTH_ALLOWED_ORIGIN: "http://localhost:8084"
      VELDRA_AUTH_RATE_LIMIT_MULTIPLIER: "${VELDRA_AUTH_RATE_LIMIT_MULTIPLIER:-1}"
      VELDRA_AUTH_TRUST_PROXY: "1"
      # Required at startup since v1.1.0 (rg-auth hardening sweep). Shadow
      # uses a deterministic placeholder because no real license signing
      # happens in shadow mode. Parity with docker-compose.observe.yml.
      VELDRA_LICENSE_SIGNING_KEY: "${VELDRA_LICENSE_SIGNING_KEY:-KioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKio}"
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3030/auth/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  # ── Dashboard (operator UI) ──
  rg-dashboard:
    build:
      context: .
      dockerfile: services/rg-dashboard/Dockerfile
    user: "0"
    environment:
      VELDRA_ALLOW_NON_LOOPBACK: "1"
      VELDRA_LOG_FORMAT: json
      VELDRA_LOG_FILTER: info
      VELDRA_DASHBOARD_CONFIG: /config/dashboard.toml
      VELDRA_MODE: shadow
    volumes:
      - ./dev:/config:ro
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      pool-verifier:
        condition: service_healthy
      template-manager:
        condition: service_healthy
