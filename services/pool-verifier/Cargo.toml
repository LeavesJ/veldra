[package]
name = "pool-verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
toml = "0.8"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
tokio-rustls = "0.26"
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rg-protocol = { path = "../rg-protocol" }
reservegrid-common = { path = "../reservegrid-common" }
rg-consensus = { path = "../rg-consensus" }
prometheus-client = { workspace = true }
subtle = "2"
tower-http = { version = "0.6", features = ["limit"] }
hex = "0.4"

[[bin]]
name = "pool-verifier"
path = "src/main.rs"

[[bin]]
name = "init-policy"
path = "src/bin/init_policy.rs"

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Phase 2 #3 integration tests (`tests/phase2_eval.rs`,
# `tests/phase2_tcp.rs`) and the PB-26 ingress cap regression
# (`tests/ingress_conn_cap.rs`). Integration tests are separate crates
# and cannot reach the package's regular `[dependencies]` directly, so
# the same crates need to be re-listed here for the test binaries.
rg-protocol = { path = "../rg-protocol" }
rg-consensus = { path = "../rg-consensus" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# Not a new workspace dependency: the same reqwest already builds for
# this crate above. `ingress_conn_cap.rs` scrapes the public /metrics
# endpoint to assert the PB-26 refusal is observable.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[lints]
workspace = true