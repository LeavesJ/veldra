[package]
name = "template-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
# PB-37: `float_roundtrip` is LOAD BEARING, not a nicety. The share-relay body
# hash is recomputed here by re-serializing the parsed submission, so every
# field must be a fixed point under serialize/parse/serialize. Without this
# feature serde_json's float parser is not correctly rounded and
# `difficulty_display` moves by an ULP above ~2^51, changing the body hash and
# silently rejecting correctly signed shares.
# `difficulty_round_trips_across_the_whole_u64_domain` fails if this is dropped.
serde_json = { version = "1", features = ["float_roundtrip"] }
anyhow = "1"
rg-protocol = { path = "../rg-protocol" }
reservegrid-common = { path = "../reservegrid-common" }
rg-consensus = { path = "../rg-consensus" }
bitcoincore-rpc = "0.18"
toml = "0.8"
axum = "0.8"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
tower-http = { version = "0.6", features = ["limit"] }
prometheus-client = { workspace = true }

# PB-37: the share-relay HMAC is a cross-service contract, and it was broken for
# months because each side was only ever tested against a fixture built with its
# own assumptions. The gateway's REAL signer is pulled in here so the contract
# test can run both sides against each other rather than one side against itself.
[dev-dependencies]
sv2-gateway = { path = "../sv2-gateway" }

[lints]
workspace = true
